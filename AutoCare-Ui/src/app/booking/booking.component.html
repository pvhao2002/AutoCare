<div class="wrap">
  <div class="grid">

    <!-- ========== TẠO BOOKING / MAINTENANCE ORDER ========== -->
    <div class="card" style="grid-column: 1 / -1">
      <h3>Tạo lịch bảo dưỡng</h3>
      <p class="muted">Nhập thông tin khách hàng, xe và trạng thái đơn.</p>

      <form class="form">
        <div class="field">
          <label>Khách hàng</label>
          <input class="input" placeholder="Tên khách hàng">
        </div>

        <div class="field">
          <label>Biển số xe</label>
          <input class="input" placeholder="51H-123.45">
        </div>

        <div class="field">
          <label>Hãng xe</label>
          <input class="input" placeholder="Toyota">
        </div>

        <div class="field">
          <label>Model</label>
          <input class="input" placeholder="Vios">
        </div>

        <div class="field">
          <label>Năm sản xuất</label>
          <input class="input" type="number">
        </div>

        <div class="field">
          <label>Trạng thái đơn</label>
          <select class="select">
            <option>NEW</option>
            <option>IN_PROGRESS</option>
            <option>DONE</option>
            <option>CANCELLED</option>
          </select>
        </div>
      </form>

      <div class="toolbar">
        <button class="btn">Tạo đơn bảo dưỡng</button>
      </div>
    </div>

    <!-- ========== PHÂN CÔNG NHÂN VIÊN ========== -->
    <div class="card" style="grid-column: span 6">
      <h3>Phân công nhân viên</h3>

      <form class="form">
        <div class="field">
          <label>Nhân viên</label>
          <select class="select">
            <option>Nguyễn Văn A</option>
            <option>Trần Văn B</option>
          </select>
        </div>

        <div class="field">
          <label>Công việc</label>
          <input class="input" placeholder="Thay nhớt, kiểm tra phanh">
        </div>
      </form>

      <div class="toolbar">
        <button class="btn">Thêm phân công</button>
      </div>
    </div>

    <!-- ========== VẬT TƯ SỬ DỤNG ========== -->
    <div class="card" style="grid-column: span 6">
      <h3>Vật tư sử dụng</h3>

      <form class="form">
        <div class="field">
          <label>Vật tư</label>
          <select class="select">
            <option>Nhớt động cơ</option>
            <option>Má phanh</option>
          </select>
        </div>

        <div class="field">
          <label>Số lượng</label>
          <input class="input" type="number" value="1">
        </div>
      </form>

      <div class="toolbar">
        <button class="btn">Thêm vật tư</button>
      </div>
    </div>

    <!-- ========== DANH SÁCH BOOKING ========== -->
    <div class="card" style="grid-column: 1 / -1">
      <h3>Danh sách đơn bảo dưỡng</h3>

      <table class="table">
        <thead>
        <tr>
          <th>#</th>
          <th>Khách hàng</th>
          <th>Biển số</th>
          <th>Xe</th>
          <th>Trạng thái</th>
          <th>Ngày tạo</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td>1</td>
          <td>Nguyễn Văn A</td>
          <td>51H-123.45</td>
          <td>Toyota Vios</td>
          <td>
            <span class="status ok"><span>IN_PROGRESS</span></span>
          </td>
          <td>09/12/2025</td>
        </tr>

        <tr>
          <td>2</td>
          <td>Trần Văn B</td>
          <td>59A-888.99</td>
          <td>Honda City</td>
          <td>
            <span class="status warn"><span>NEW</span></span>
          </td>
          <td>09/12/2025</td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
