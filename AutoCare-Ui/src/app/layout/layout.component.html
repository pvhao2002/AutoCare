<header class="topbar" role="navigation" aria-label="Top navigation">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" role="img" aria-label="AutoCare Secure Logo">
        <path d="M12 2a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V2z"/>
        <path d="M18 9.5c2 0 4-1 4-1v6c0 3.5-2.5 6.5-6 7-3.5-.5-6-3.5-6-7v-6s2 1 4 1 2-.5 4-.5 2 .5 4 .5z"
              opacity=".35"/>
      </svg>
    </div>
    <div>
      <div class="title">AutoCare</div>
      <small class="subtitle">Admin</small>
    </div>
  </div>

  <!-- ✅ Dùng routerLink -->
  <nav class="menu" aria-label="Main menu">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Trang chủ</a>
    @for (m of menus; track m) {
      <a routerLink="{{ m.link }}" routerLinkActive="active">{{ m.name }}</a>
    }
  </nav>

  <div class="actions">
    <button class="btn" (click)="onQuickAction()">+ Đặt lịch</button>
    <!-- ✅ Badge Chi nhánh -->
    <span class="badge badge-branch">
    🏢 {{ userService.profile.branch.branchName | translate }}
  </span>

    <!-- ✅ Badge Quyền -->
    <span class="badge badge-role" [ngClass]="userService.profile.role">
    👤 {{ userService.profile.role | translate }}
  </span>
    <button class="btn" style="background:linear-gradient(180deg,#f43f5e,#b91c1c)"
            (click)="onLogout()">
      Đăng xuất
    </button>
  </div>
</header>

<main class="wrap">
  <router-outlet></router-outlet>
</main>
