<div class="toast-wrapper">
  @for (t of toastService.toasts(); track $index) {
    <div class="toast {{t.type}}" (click)="toastService.remove($index)">
      <div class="icon">
        @if (t.type === 'success') {
          ✓
        } @else {
          ⚠
        }
      </div>
      <div class="message">{{ t.message }}</div>
    </div>
  }
</div>
